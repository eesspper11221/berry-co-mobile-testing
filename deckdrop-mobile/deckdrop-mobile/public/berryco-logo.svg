  <!-- Top Text: COLLECT. TRADE. PLAY. -->
  <text fill="#A81B1A" font-size="31" font-weight="900" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" letter-spacing="4.5">
    <textPath href="#topArcPath" startOffset="50%" text-anchor="middle">
      COLLECT. TRADE. PLAY.
    </textPath>
  </text>

  <!-- Bottom Text: HOBBY & TCG CARD GAME STORE -->
  <text fill="#A81B1A" font-size="24.5" font-weight="900" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" letter-spacing="3">
