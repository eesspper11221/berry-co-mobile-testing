      <stop offset="50%" stopColor="#E63935" />
      <stop offset="100%" stopColor="#A81512" />
    </radialGradient>
    <path id="topArcPath" d="M 85,250 A 165,165 0 0,1 415,250" fill="none" />
    <path id="bottomArcPath" d="M 425,250 A 175,175 0 0,1 75,250" fill="none" />
  </defs>

  <!-- Outer Red Ring -->
  <circle cx="250" cy="250" r="240" fill="#B3201F" stroke="#8E1413" stroke-width="3" />

  <!-- Cream Middle Ring -->
  <circle cx="250" cy="250" r="222" fill="#FAF1D9" />
