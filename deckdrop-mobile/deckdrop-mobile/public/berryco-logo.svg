  <circle cx="250" cy="250" r="158" fill="url(#berryBgGrad)" />

  <!-- Script Brand: BerryCo. -->
  <g transform="translate(250, 148)">
    <text x="2" y="2" text-anchor="middle" fill="#536B42" font-size="44" font-style="italic" font-weight="900" font-family="Brush Script MT, cursive, serif">
      BerryCo.
    </text>
    <text x="0" y="0" text-anchor="middle" fill="#FAF1D9" stroke="#FAF1D9" stroke-width="5" font-size="44" font-style="italic" font-weight="900" font-family="Brush Script MT, cursive, serif">
