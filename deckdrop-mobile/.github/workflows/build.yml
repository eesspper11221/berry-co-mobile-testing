name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: deckdrop-mobile

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deckdrop-mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-36"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: npm run mobile:sync

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: deckdrop-mobile/android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: berry-co-debug-apk
          path: deckdrop-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error